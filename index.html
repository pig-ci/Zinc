<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zinc - 加密編輯器與檔案轉換器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="top-bar">
      <div class="brand-and-title">
        <div class="brand-logo">Zinc</div>
        <input type="text" id="filename-input" class="file-title" value="未命名文件.zinc">
      </div>
      
      <div class="header-right">
        <!-- 暗色主題切換按鈕 -->
        <button class="icon-toggle-btn" id="theme-btn" onclick="toggleTheme()" title="切換深淺模式">
          <svg id="theme-icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          <svg id="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>

        <!-- 漢堡選單按鈕 -->
        <button class="icon-toggle-btn hamburger-btn" id="hamburger-btn" onclick="toggleMenu()" aria-label="切換選單">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="menu-icon">
            <line x1="4" y1="5" x2="20" y2="5" class="line-top" />
            <line x1="4" y1="12" x2="20" y2="12" class="line-middle" />
            <line x1="4" y1="19" x2="20" y2="19" class="line-bottom" />
          </svg>
        </button>
      </div>
    </div>

    <!-- 摺疊選單容器 -->
    <div id="nav-menu" class="nav-menu">
      <div class="action-buttons">
        <button class="btn btn-secondary" onclick="triggerUpload()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg>
          載入 ZINC
        </button>
        <button class="btn btn-image" onclick="triggerImageUpload()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
          圖片轉 ZINC
        </button>
<button class="btn btn-zip" onclick="triggerZipUpload()">
  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-package"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><polyline points="3.29 7 12 12 20.71 7"/><path d="m7.5 4.27 9 5.15"/></svg>
  ZIP 轉 ZINC
</button>
        <button class="btn" onclick="downloadFile()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>
          下載加密 ZINC
        </button>
      </div>
<!-- 最近開啟區塊 -->
<div class="recent-files-container" id="recent-files-container">
  <span class="recent-title">最近開啟：</span>
  <div class="recent-list" id="recent-list">
    <!-- 由 JS 動態渲染按鈕 -->
  </div>
  <button class="btn-clear-recent" onclick="clearRecentFiles()" title="清除歷史紀錄">清除</button>
</div>
      <div class="toolbar" id="text-toolbar">
        <div class="toolbar-left">
          <button id="undo-btn" class="btn btn-secondary icon-btn" onclick="undo()" disabled title="復原 (Ctrl+Z)">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            復原
          </button>
          <button id="redo-btn" class="btn btn-secondary icon-btn" onclick="redo()" disabled title="重做 (Ctrl+Y)">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            重做
          </button>
        </div>
        <div class="toolbar-right">
          <span id="char-count">字數：0</span>
          <span id="line-count">行數：1</span>
          <span id="status-msg">狀態：就緒</span>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="editor-container">
      <textarea id="editor" placeholder="在此開始輸入內容，或點擊上方按鈕載入/轉換檔案..."></textarea>
      
      <div id="media-viewer" class="media-viewer">
        <img id="decrypted-img" src="" alt="解密後的圖片預覽" style="display:none;">
        
        <div id="zip-box" class="zip-icon-box" style="display:none;">
          <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--primary-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8v13H3V3h10"/><path d="M18 2v6h6"/><path d="M10 12h4"/><path d="M10 16h4"/></svg>
          <span id="zip-info-text" style="font-weight:600; color:var(--text-title);">已解密 Zip 檔案</span>
        </div>

        <button class="btn btn-secondary" id="download-raw-media-btn" onclick="downloadDecryptedMedia()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
          匯出原始檔案
        </button>
      </div>
    </div>
  </main>

  <div id="toast-container" class="toast-container"></div>

  <input type="file" id="file-input" accept=".zinc" onchange="uploadFile(event)">
  <input type="file" id="image-input" accept="image/*" onchange="convertImageToZinc(event)">
  <input type="file" id="zip-input" accept=".zip,application/zip,application/x-zip-compressed" onchange="convertZipToZinc(event)">

  <script src="script.js"></script>
</body>
</html>
